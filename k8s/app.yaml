apiVersion: apps/v1
kind: Deployment
metadata: { name: backend }
spec:
  replicas: 1
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      containers:
      - name: backend
        image: knowledgehub-backend:latest
        imagePullPolicy: IfNotPresent
        ports: [{ containerPort: 5000 }]
        envFrom: [{ configMapRef: { name: knowledgehub-config } }, { secretRef: { name: knowledgehub-secret } }]
        readinessProbe: { httpGet: { path: /api/health, port: 5000 }, initialDelaySeconds: 10, periodSeconds: 10 }
        resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: backend }
spec: { selector: { app: backend }, ports: [{ port: 5000 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend }
spec:
  replicas: 1
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
      - name: frontend
        image: knowledgehub-frontend:latest
        imagePullPolicy: IfNotPresent
        ports: [{ containerPort: 80 }]
        resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 250m, memory: 256Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: frontend }
spec: { type: NodePort, selector: { app: frontend }, ports: [{ port: 80, targetPort: 80, nodePort: 30080 }] }
